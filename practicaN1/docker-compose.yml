version: '3.8'

services:
  # ---------------------------
  # BASE DE DATOS (POSTGRESQL)
  # ---------------------------
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: 'proyecto_db'
      POSTGRES_USER: 'usuario_dev'
      POSTGRES_PASSWORD: 'password_dev'
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_dev -d proyecto_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------
  # BACKEND (DJANGO DRF)
  # ---------------------------
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_backend
    # Esperamos a la DB, hacemos migraciones y corremos el server
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=proyecto_db
      - DB_USER=usuario_dev
      - DB_PASS=password_dev
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=1
    networks:
      - app-network

  # ---------------------------
  # FRONTEND (VITE / REACT)
  # ---------------------------
  frontend:
    build:
      context: ./practicaN1
      dockerfile: Dockerfile
    container_name: vite_frontend
    volumes:
      - ./practicaN1:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge